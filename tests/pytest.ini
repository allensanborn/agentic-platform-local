[pytest]
# Files are numbered so they run cheapest-first: a cluster that is not up should fail in
# test_00 rather than 6 minutes later inside a sandbox probe.
testpaths = .
addopts = -v --tb=short -p no:cacheprovider
# conftest.py is imported by the test modules (`from conftest import kubectl`), so the
# test directory must be on sys.path.
pythonpath = .
