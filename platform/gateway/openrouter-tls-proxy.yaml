# TLS origination for the OpenRouter backend — a workaround, and worth reading
# as one rather than mistaking it for architecture.
#
# THE PROBLEM. Envoy Gateway's `Backend` resource cannot originate TLS on its
# own; upstream TLS is configured with a Gateway API `BackendTLSPolicy`. On this
# cluster that resource exists but is inert:
#
#   $ kubectl logs -n envoy-gateway-system deploy/envoy-gateway | grep BackendTLS
#   INFO provider  BackendTLSPolicy CRD not found, skipping BackendTLSPolicy watch
#
# despite the CRD being present and discoverable. The cause is an ownership
# collision that is specific to k3s: k3s ships Traefik, Traefik's Helm chart
# installs the Gateway API CRDs, and its bundle (v1.4.0, standard channel) serves
# only `v1` — `v1alpha3`, the version Envoy Gateway v1.5.6 watches, is present in
# the CRD but `served: false`. Forcing `served: true` on it and restarting the
# controller does not help; the controller still reports the CRD as absent. So
# the gateway dials openrouter.ai:443 in cleartext and Cloudflare answers:
#
#   400 The plain HTTP request was sent to HTTPS port
#
# That is a useful error to record, because "the model backend does not respond"
# and "the gateway is speaking the wrong protocol at it" look identical from an
# agent's point of view.
#
# THE WORKAROUND. One nginx that terminates nothing and originates TLS: the
# gateway sends plain HTTP to this Service inside the cluster, and this Service
# makes the HTTPS call out. The Backend in openrouter.yaml points here instead of
# at openrouter.ai directly.
#
# WHAT THIS DOES NOT CHANGE, which is the part that matters for labs 6-7:
#   - The API key is still injected by the GATEWAY (BackendSecurityPolicy), at
#     the cluster edge. This proxy never reads it; it forwards the Authorization
#     header it is given.
#   - The sandbox's egress allowlist is untouched. It still reaches exactly the
#     in-cluster AI gateway and Gitea. It cannot reach this proxy, and it cannot
#     reach openrouter.ai. Limits #2 and #3 hold exactly as before.
#
# WHAT IT COSTS. The key and the request body cross one in-cluster hop in
# cleartext (gateway -> proxy) before TLS starts. On a single-node laptop cluster
# that hop is a veth pair inside one Linux namespace. On a real cluster it would
# want mTLS or a mesh, and this file should not be copied there as-is.
---
apiVersion: v1
kind: Namespace
metadata:
  name: model-access
  labels:
    kubernetes.io/metadata.name: model-access
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openrouter-tls-proxy
  namespace: model-access
data:
  nginx.conf: |
    events {}
    http {
      # Buffering OFF end to end. The coding agent streams (SSE), and nginx's
      # default response buffering would hold the whole completion and hand it
      # over at once — which does not break correctness but does turn a live
      # agent log into a long silence followed by a wall of text.
      proxy_buffering off;
      proxy_request_buffering off;
      # Even with buffering off, nginx reads the RESPONSE HEADER into one buffer
      # of proxy_buffer_size (4k default). OpenRouter's response headers exceed
      # that, and the failure is a bare 502 whose only trace is in this pod's log
      # ("upstream sent too big header"). The gateway above it reports an opaque
      # internal_server_error, so the diagnosis is not visible from the agent.
      proxy_buffer_size 32k;
      proxy_buffers 8 32k;

      server {
        listen 8080;
        # The upstream is a fixed name, so it is resolved once at startup by
        # nginx's own resolver rather than needing a `resolver` directive.
        location / {
          proxy_pass https://openrouter.ai;
          proxy_ssl_server_name on;
          proxy_ssl_name openrouter.ai;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 3;
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          proxy_set_header Host openrouter.ai;
          proxy_http_version 1.1;
          # Long completions: a coding agent's turn can take minutes on a free
          # tier. The default 60s read timeout cuts them off mid-stream.
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrouter-tls-proxy
  namespace: model-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openrouter-tls-proxy
  template:
    metadata:
      labels:
        app: openrouter-tls-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
      volumes:
        - name: conf
          configMap:
            name: openrouter-tls-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: openrouter-tls-proxy
  namespace: model-access
spec:
  selector:
    app: openrouter-tls-proxy
  ports:
    - port: 8080
      targetPort: 8080
