# Lab 0 — the AI Gateway, local port.
#
# Workshop original: platform/manifests/envoy-ai-gateway-bedrock.yaml, where an
# AIGatewayRoute fronts Amazon Bedrock and the gateway signs each request with
# SigV4 via EKS Pod Identity.
#
# Local version: the same AIGatewayRoute fronting Ollama on the host. The SigV4
# hop simply disappears — there is no cloud credential to hold, so the property
# the workshop works hard for ("the agent holds no model credential") is true
# here for free.
#
# The point being demonstrated is the ALIAS TABLE. The agent asks for
# `local-fast`; the gateway rewrites that to a real backend model name via
# modelNameOverride. Swapping the model underneath an agent is a change to THIS
# file and nothing else — the agent image, code and config stay untouched.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Pins the generated data-plane Service name. Without this Envoy Gateway appends a hash
# (envoy-<ns>-<gw>-<hash>), which an agent's MODEL_BASE_URL cannot depend on. Same trick the
# workshop uses, and it yields the workshop's exact in-cluster URL:
#     http://ai-gateway.envoy-gateway-system.svc.cluster.local/v1
# Note the Service is created in the Envoy Gateway CONTROLLER namespace
# (envoy-gateway-system), not in this manifest's namespace.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ai-gateway-proxy
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
        name: ai-gateway
      envoyDeployment:
        container:
          # Clear the large default requests so this fits comfortably on a laptop.
          resources: {}
  # LAB 2. Make the gateway a participant in the trace, not just a proxy. The agent's
  # auto-instrumented httpx already sends W3C traceparent on the outbound call; with this
  # the gateway CONTINUES that trace instead of starting a disconnected one, so one chat
  # turn is a single tree spanning two services. That cross-service nesting is the whole
  # point of lab 2 — without it you have two unrelated traces and no way to attribute
  # latency to the model hop.
  telemetry:
    tracing:
      samplingRate: 100
      provider:
        backendRefs:
          - name: otel-collector
            namespace: telemetry
            port: 4317
        type: OpenTelemetry
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ai-gateway
  namespace: default
spec:
  gatewayClassName: envoy-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ai-gateway-proxy
---
# Ollama runs on the host, outside the k3d cluster, because that is where the GPU is.
#
# Use host.docker.internal, NOT host.k3d.internal. k3d injects host.k3d.internal into
# CoreDNS and it looks like the obvious choice, but on macOS it resolves to the Docker
# bridge gateway (192.168.147.1) — which is the Linux VM Docker Desktop runs, not the Mac
# where Ollama is listening. Verified from inside the cluster:
#     host.docker.internal -> 200
#     host.k3d.internal    -> connection refused
# Ollama must also be bound to all interfaces (OLLAMA_HOST=0.0.0.0:11434); it listens on
# 127.0.0.1 by default, which the cluster cannot reach either.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ollama
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: host.docker.internal
        port: 11434
---
# schema.name: OpenAI is the load-bearing field — it says "this backend speaks
# the OpenAI wire format", which is what makes any local engine (Ollama,
# llama.cpp's llama-server, vLLM) a legal backend here. It is the same field the
# workshop sets to AWSBedrock.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ollama
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: ollama
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: local
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    # THE ALIAS TABLE. Client-facing name on the left, real model on the right.
    # Workshop equivalent:
    #   claude-sonnet -> us.anthropic.claude-sonnet-4-5-20250929-v1:0
    #
    # Swapping the model an agent uses is an edit to THIS table and nothing else — no agent
    # code, image, or config changes. That is the whole thesis of lab 0, and it is worth
    # demonstrating live:
    #     kubectl patch aigatewayroute local --type=json \
    #       -p '[{"op":"replace","path":"/spec/rules/0/backendRefs/0/modelNameOverride","value":"llama3.2:1b"}]'
    #     # same request, same alias, different model answers
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: local-fast
      backendRefs:
        - name: ollama
          # Small and quick. Answers plainly with no reasoning preamble, which makes it the
          # better default for demos (see ADR 0003 on qwen3's reasoning tokens).
          modelNameOverride: llama3.2:1b
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: local-smart
      backendRefs:
        - name: ollama
          # Stronger tool-calling; this is the one that reliably drives lookup_order.
          modelNameOverride: qwen3:8b
