# Lab 2 — the observability control point.
#
# The workshop's shape, preserved: workloads speak plain OTLP to a shared collector, and the
# COLLECTOR is the only thing that holds credentials for the tracing backend. One key to
# rotate; no workload ever sees it. That property is the lesson, and it is independent of
# which backend sits behind the collector.
#
# Backend (see ADR 0004 and 0008): the workshop uses Langfuse, and so does this. The earlier
# substitution — that Langfuse could not fit on this machine — was WRONG and is retracted.
# Langfuse runs here in the `langfuse` namespace at ~1.6 GiB steady state, an order of
# magnitude under the production sizing guidance I mistook for a requirement.
#
# Langfuse is the only trace backend. Jaeger lived here only because I wrongly concluded
# Langfuse could not fit on this machine (retracted — see ADR 0004 and 0008); once Langfuse
# was measured at ~1.6 GiB the second backend was redundant, and running two of anything you
# do not need is how a demo stops being legible.
#
# Removing it cost exactly one exporter block and one pipeline entry, and touched no workload
# — which is the same collector-as-control-point argument the fan-out made, just in reverse.
# Adding Jaeger back for raw span-tree debugging is the same one-block change.
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: telemetry
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
      # Streaming endpoints defeat naive auto-instrumentation: the ASGI middleware opens a
      # span per SSE chunk, so ONE chat turn produced 543 spans, ~530 of them named
      # "POST /chat http send" and carrying nothing. Dropping them here rather than in the
      # app is deliberate — the collector is the control point, and telemetry shaping is
      # exactly the sort of policy that belongs at a control point instead of in every
      # workload that might stream.
      filter/drop_sse_chunk_spans:
        error_mode: ignore
        traces:
          span:
            - 'name == "POST /chat http send"'
            - 'name == "POST /chat http receive"'
            - 'IsMatch(name, "GET /healthz.*")'
    exporters:

      # --- Langfuse: deployed and verified, not currently wired ------------------------
      # To use it, uncomment this exporter and add it to the traces pipeline below. Keep
      # Three traps worth keeping, learned the hard way:
      # backends receive identical spans and can be compared side by side.
      #
      # Three details that are easy to get wrong, all of them found the hard way:
      #   1. otlphttp, NOT otlp. Langfuse exposes OTLP over HTTP only — there is no gRPC
      #      listener — so the plain `otlp/` exporter form (gRPC) cannot reach it.
      #   2. `traces_endpoint` (a full URL including the path), not `endpoint`. With
      #      `endpoint` the collector appends its own /v1/traces, which 404s against
      #      Langfuse's /api/public/otel base path.
      #   3. Auth is HTTP Basic over the API key PAIR, not a bearer token:
      #        printf 'PUBLIC_KEY:SECRET_KEY' | base64
      #      The value below is base64 of the fixed demo pair that LANGFUSE_INIT_* in
      #      20-langfuse.yaml provisions headlessly:
      #        pk-lf-agentic-platform-local:sk-lf-agentic-platform-local
      #      Provisioning the keys from config, rather than clicking through a signup, is
      #      what lets this credential be checked in as a static value.
      #
      # Verified end to end: spans sent with telemetrygen to this exact URL and header
      # appeared in the Langfuse API and as rows in ClickHouse. OTLP ingestion needs
      # Langfuse >= 3.22.0; the deployment in platform/observability/langfuse/ runs 3.225.2.
      #
      otlphttp/langfuse:
        traces_endpoint: http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel/v1/traces
        headers:
          Authorization: "Basic cGstbGYtYWdlbnRpYy1wbGF0Zm9ybS1sb2NhbDpzay1sZi1hZ2VudGljLXBsYXRmb3JtLWxvY2Fs"

      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [filter/drop_sse_chunk_spans, batch]
          exporters: [otlphttp/langfuse, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/conf/config.yaml"]
          ports:
            - {containerPort: 4318, name: otlp-http}
            - {containerPort: 4317, name: otlp-grpc}
          volumeMounts:
            - {name: config, mountPath: /conf}
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: telemetry
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
    # appProtocol: grpc is load-bearing, not documentation. Envoy Gateway infers the
    # upstream protocol from it; without it the generated `tracing` cluster carries NO
    # http2_protocol_options, so Envoy speaks gRPC over HTTP/1.1 and the collector's gRPC
    # receiver rejects the stream. Symptom set: tracing.opentelemetry.spans_sent increments,
    # spans_dropped stays 0, the endpoint reports HEALTHY, cluster.tracing shows
    # internal.upstream_rq_5xx + upstream_cx_destroy_local_with_active_rq, and the collector
    # logs NOTHING because it never sees a valid gRPC stream. See ADR 0004.
    - {name: otlp-grpc, port: 4317, targetPort: 4317, appProtocol: grpc}

