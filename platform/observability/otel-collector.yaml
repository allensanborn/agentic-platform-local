# Lab 2 — the observability control point.
#
# The workshop's shape, preserved: workloads speak plain OTLP to a shared collector, and the
# COLLECTOR is the only thing that holds credentials for the tracing backend. One key to
# rotate; no workload ever sees it. That property is the lesson, and it is independent of
# which backend sits behind the collector.
#
# Backend substitution (see ADR 0004): the workshop uses Langfuse. Langfuse v4 self-hosted is
# six containers (web, worker, ClickHouse, MinIO, Redis, Postgres) with official sizing of
# 4 cores / 16 GiB. This machine's Docker VM has 11.7 GiB total and the cluster already uses
# ~2 GiB, so Langfuse would starve everything else. Jaeger speaks the same OTLP and renders
# the same nested spans, so the MECHANISM being taught is fully intact; what is lost is
# Langfuse's LLM-specific UI (prompt/completion rendering, token cost). Swapping back is an
# exporter endpoint change in this file.
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: telemetry
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
      # Streaming endpoints defeat naive auto-instrumentation: the ASGI middleware opens a
      # span per SSE chunk, so ONE chat turn produced 543 spans, ~530 of them named
      # "POST /chat http send" and carrying nothing. Dropping them here rather than in the
      # app is deliberate — the collector is the control point, and telemetry shaping is
      # exactly the sort of policy that belongs at a control point instead of in every
      # workload that might stream.
      filter/drop_sse_chunk_spans:
        error_mode: ignore
        traces:
          span:
            - 'name == "POST /chat http send"'
            - 'name == "POST /chat http receive"'
            - 'IsMatch(name, "GET /healthz.*")'
    exporters:
      # The single egress. Swap this block for Langfuse's OTLP endpoint (plus its
      # Authorization header) and nothing about the workloads changes.
      otlp/jaeger:
        endpoint: jaeger.telemetry.svc.cluster.local:4317
        tls:
          insecure: true
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [filter/drop_sse_chunk_spans, batch]
          exporters: [otlp/jaeger, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/conf/config.yaml"]
          ports:
            - {containerPort: 4318, name: otlp-http}
            - {containerPort: 4317, name: otlp-grpc}
          volumeMounts:
            - {name: config, mountPath: /conf}
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: telemetry
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {containerPort: 16686, name: ui}
            - {containerPort: 4317, name: otlp-grpc}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "768Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: telemetry
spec:
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: 16686}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
