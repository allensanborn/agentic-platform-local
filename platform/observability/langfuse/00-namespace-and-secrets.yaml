# Lab 2 — Langfuse, memory-tuned for a laptop.
#
# Upstream sizing guidance for self-hosted Langfuse is "4 cores / 16 GiB" and the official
# Helm chart requests ~9 GiB for ClickHouse alone (resourcesPreset: 2xlarge x 3 replicas).
# That guidance is for a PRODUCTION ingest rate. Nothing about the six-container topology
# requires it; the memory is almost entirely ClickHouse's default cache sizing, which is
# expressed as a fraction of host RAM and therefore scales itself up to fill whatever it
# lands on. Pin those caches explicitly and the whole stack fits in ~2.6 GiB of steady-state
# RSS (see README.md for measured numbers).
#
# Dev-only posture, stated plainly so nobody copies this into production:
#   - single-node ClickHouse, CLICKHOUSE_CLUSTER_ENABLED=false, no Keeper/ZooKeeper
#   - single replica of every component, no HA, no PDBs
#   - secrets are literal in-repo values (this is a local demo cluster, not a real one)
#   - ClickHouse system.*_log tables disabled — they are the single largest idle memory
#     and disk consumer in a default ClickHouse and are pure self-telemetry
apiVersion: v1
kind: Namespace
metadata:
  name: langfuse
---
# Demo credentials. Regenerate with:
#   NEXTAUTH_SECRET / SALT : openssl rand -base64 32
#   ENCRYPTION_KEY         : openssl rand -hex 32   (must be exactly 64 hex chars)
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: langfuse
type: Opaque
stringData:
  NEXTAUTH_SECRET: "gUrEjhQ9gq3DZTCH86RMuSQwWNsb95omtKqpTlC8mnA="
  SALT: "RO4cQvBt+toItblvGS1yIjo6ULRpcErtxG+jFXSr9QM="
  ENCRYPTION_KEY: "94a9bb5f10ccfa8ede67a5e3fd4fafc5e58e0be7278e7a9106e5e54ed20adaf3"
  POSTGRES_PASSWORD: "langfuse"
  CLICKHOUSE_PASSWORD: "clickhouse"
  REDIS_AUTH: "redis"
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "miniosecret"
  DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-postgres.langfuse.svc.cluster.local:5432/langfuse"
