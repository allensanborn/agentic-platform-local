# The v0.5.0 SDK cannot send the router's ROUTER_AUTH_TOKEN (no auth field on any
# connection config), so the router runs app-layer-unauthenticated. Access is enforced at
# the network layer instead: only the code-executor broker (ns default) may reach the
# router on :8080.
#
# Labs 6-7 add a second legitimate client, the coding-agent dispatcher. Both are
# listed explicitly rather than loosening the selector to "any pod in default":
# the router vends command execution inside sandboxes, so its ingress list should
# read as an enumeration of the things allowed to do that.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router-ingress
  namespace: agent-sandbox-system
spec:
  podSelector:
    matchLabels:
      app: sandbox-router
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: code-executor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: coding-agent
      ports:
        - protocol: TCP
          port: 8080
