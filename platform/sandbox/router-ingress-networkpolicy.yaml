# The v0.5.0 SDK cannot send the router's ROUTER_AUTH_TOKEN (no auth field on any
# connection config), so the router runs app-layer-unauthenticated. Access is enforced at
# the network layer instead: only the code-executor broker (ns default) may reach the
# router on :8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router-ingress
  namespace: agent-sandbox-system
spec:
  podSelector:
    matchLabels:
      app: sandbox-router
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: code-executor
      ports:
        - protocol: TCP
          port: 8080
