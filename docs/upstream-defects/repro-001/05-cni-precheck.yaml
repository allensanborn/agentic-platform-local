# CNI pre-check. Run this BEFORE step 5, and ideally before trusting anything in this
# reproducer at all.
#
# Step 5 asks you to read meaning into a failed connection. That reading is only valid on a
# cluster whose CNI actually enforces NetworkPolicy. kindnet silently ignores NetworkPolicy
# entirely, in which case step 5's "pooled pod blocked" would never happen and you would
# wrongly conclude the reproducer had failed — or, on a cluster with no egress at all, both
# probes fail and you would wrongly conclude the policy was working.
#
# Two pods, identical except for one label. `selected` is covered by a deny-all-egress policy;
# `control` is not. The pre-check passes when control REACHES and selected is BLOCKED.
#
# This namespace is independent of the reproducer's own; delete it when you are done.
apiVersion: v1
kind: Namespace
metadata:
  name: repro-cni-precheck
  labels:
    kubernetes.io/metadata.name: repro-cni-precheck
---
apiVersion: v1
kind: Pod
metadata:
  name: selected
  namespace: repro-cni-precheck
  labels:
    probe: selected
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: control
  namespace: repro-cni-precheck
  labels:
    probe: control
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-selected
  namespace: repro-cni-precheck
spec:
  podSelector:
    matchLabels:
      probe: selected
  policyTypes:
    - Ingress
    - Egress
  egress: []
