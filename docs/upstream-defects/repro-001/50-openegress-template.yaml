# The positive control for step 5c.
#
# Step 5 on a current agent-sandbox reports that the claimed pod is BLOCKED. On its own that
# tells you almost nothing: a claimed pod with no route out at all would look identical, and so
# would a claimed pod blocked by something other than the SandboxTemplate's networkPolicy.
#
# This is the same setup as 10/20/40, in its own namespace, with exactly one field changed:
#
#     networkPolicy.egress: []     ->     networkPolicy.egress: [{}]
#
# `[]` is "no egress rules", i.e. deny everything. `[{}]` is "one rule with no restrictions",
# i.e. allow everything. Same controller, same warm pool, same claim path, same image, same
# node. If the claimed pod here REACHES the internet while the claimed pod in
# repro-warmpool-label does not, then the SandboxTemplate's networkPolicy is what is deciding —
# which is the whole question step 5 is asking on versions >= v0.5.2.
#
# Wait for the pool to be Ready BEFORE the claim lands, or the claim cold-starts its own
# sandbox instead of adopting a pooled one and the control stops being about warm-pool
# adoption. run-repro.sh sequences this for you.
apiVersion: v1
kind: Namespace
metadata:
  name: repro-openegress
  labels:
    kubernetes.io/metadata.name: repro-openegress
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: repro-template-open
  namespace: repro-openegress
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    egress:
      - {}
  podTemplate:
    metadata:
      labels:
        repro-kind: sandbox
    spec:
      containers:
        - name: shell
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
      restartPolicy: "OnFailure"
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: repro-pool-open
  namespace: repro-openegress
spec:
  replicas: 2
  sandboxTemplateRef:
    name: repro-template-open
