# Minimal SandboxTemplate. Deliberately plain:
#
#   - no runtimeClassName, so this runs under the cluster's default runtime (runc) and does
#     not require gVisor, Kata, or nested virtualization. The defect is about label
#     selection and is runtime-independent.
#   - busybox `sleep`, so there is no image to build and no registry to push to.
#   - networkPolicy.egress: [] mirrors the workshop's air-gapped posture, which is what the
#     supplemental policy in 30-workshop-airgap-networkpolicy.yaml is meant to make real.
#
# podTemplate.metadata.labels sets BOTH labels the report compares:
#   repro-kind: sandbox  — a NON-reserved key. Propagates to the pod and (this is the point)
#                          survives the claim relabel.
# The reserved agents.x-k8s.io/* labels are stamped by the controller, not by us.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: repro-template
  namespace: repro-warmpool-label
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    # A custom networkPolicy REPLACES the controller's vetted defaults rather than merging,
    # so anything you want kept has to be restated here. This repro wants nothing kept.
    egress: []
  podTemplate:
    metadata:
      labels:
        repro-kind: sandbox
    spec:
      containers:
        - name: shell
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
      restartPolicy: "OnFailure"
