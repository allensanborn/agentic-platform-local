# Coding-agent dispatcher (labs 6-7). Local port of the workshop's k8s.yaml.
#
# Two changes from upstream, both forced by the environment:
#   - image: coding-agent-dispatcher:local + imagePullPolicy: Never (k3d
#     side-load; there is no registry)
#   - the model env points at the local aliases instead of claude-sonnet/haiku
# plus one change of design: CODING_AGENT, which names the script in the sandbox
# image's /opt/agents/ that actually does the coding. See the module README.
#
# Note what this Deployment is trusted with, because it is the whole point: it
# holds the bot's password (the ONE stored machine credential) and it holds the
# RBAC to create SandboxClaims. The sandbox it vends holds neither.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coding-agent
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent-dispatcher
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coding-agent
  template:
    metadata:
      labels:
        app: coding-agent
    spec:
      serviceAccountName: coding-agent
      containers:
        - name: coding-agent-dispatcher
          image: coding-agent-dispatcher:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Bot creds + webhook secret, written by platform/gitea/provision.sh.
            # NOT a human's personal access token — that is limit #1, and it is
            # enforced by there being no such token anywhere in this system.
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: coding-agent-creds, key: webhook-secret }
            - name: BOT_USERNAME
              valueFrom:
                secretKeyRef: { name: coding-agent-creds, key: bot-username }
            - name: BOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: coding-agent-creds, key: bot-password }
            - name: TRIGGER_LABEL
              valueFrom:
                secretKeyRef: { name: coding-agent-creds, key: trigger-label }
            - name: GITEA_API_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000/api/v1
            # Model path + in-cluster endpoints injected into the coding sandbox.
            # Explicit here (not code defaults) so the gateway route / model
            # aliases can be changed without rebuilding the dispatcher image.
            - name: GITEA_INTERNAL_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: MODEL_BASE_URL
              value: http://ai-gateway.envoy-gateway-system.svc.cluster.local/anthropic
            # Aliases, not model ids. `remote-*` is served by the OpenRouter
            # backend in platform/gateway/openrouter.yaml; `local-*` by Ollama on
            # the host. Switching the coding agent between them is this line.
            - name: MODEL_MAIN
              value: remote-smart
            - name: MODEL_SMALL
              value: remote-fast
            # ADR 0007's knob. A tool whose argument is an entire source file
            # needs a budget that a tool taking an order ID does not.
            - name: MODEL_MAX_TOKENS
              value: "6144"
            # THE SWAPPABLE AGENT. Names a script in the sandbox image's
            # /opt/agents/. `claude` is the workshop's own agent (Claude Code
            # CLI); `minimal` is the small tool-calling agent that exercises the
            # same trust boundary on a weaker model. Changing this is a rollout,
            # not a rebuild.
            - name: CODING_AGENT
              value: claude
            - name: SANDBOX_WARMPOOL
              value: gvisor-coding-pool
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: coding-agent-dispatcher
  namespace: default
spec:
  selector:
    app: coding-agent
  ports:
    - port: 8080
      targetPort: 8080
---
# Dispatcher RBAC: create/delete claims + watch sandboxes, in the sandbox
# namespace. Note the asymmetry that makes limit #4 work — the dispatcher has
# this Role, and the sandbox it creates has automountServiceAccountToken: false
# and therefore no way to use any Role at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coding-agent-sandbox
  namespace: agent-sandbox
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coding-agent-sandbox
  namespace: agent-sandbox
subjects:
  - kind: ServiceAccount
    name: coding-agent
    namespace: default
roleRef:
  kind: Role
  name: coding-agent-sandbox
  apiGroup: rbac.authorization.k8s.io
